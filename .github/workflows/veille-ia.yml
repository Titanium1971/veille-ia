name: Veille IA

# Le declenchement planifie est desactive : le workflow echouait deux fois par
# jour depuis juillet 2026 faute des secrets CLAUDE_CODE_OAUTH_TOKEN et
# RESEND_API_KEY (voir README). Reactiver le bloc "schedule" une fois les
# secrets configures dans Settings > Secrets and variables > Actions.
on:
  # schedule:
  #   - cron: "0 5,16 * * *"   # 5h et 16h UTC
  workflow_dispatch:
    inputs:
      slot:
        description: "morning or evening"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening
      dry_run:
        description: "Ne pas envoyer le mail"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Verifier les secrets requis
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          missing=""
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && missing="$missing CLAUDE_CODE_OAUTH_TOKEN"
          [ -z "$RESEND_API_KEY" ] && missing="$missing RESEND_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing. Les configurer dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run Veille IA
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.slot }}" = "evening" ]; then ARGS="$ARGS --evening"; fi
          if [ "${{ github.event.inputs.slot }}" = "morning" ]; then ARGS="$ARGS --morning"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/index.mjs $ARGS
